name: Bug report
description: Report a bug in Tap & Slap
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Commit SHA or release tag where you saw the issue
      placeholder: "e.g. 0e83278 or v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser & device
      options:
        - Chrome (desktop)
        - Firefox (desktop)
        - Safari (desktop)
        - iOS Safari
        - Android Chrome
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: "I was playing Neon Rampage when…"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '…'
        2. Click on '…'
        3. Scroll to '…'
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console / error output
      description: Paste any console errors you saw (F12 → Console).
      render: shell
